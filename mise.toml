# Adapted from entireio/entire-brain (MIT, see NOTICE).
[tools]
go = "1.27.4"
shellcheck = "0.11.0"
goreleaser = '2.20.3'

# Credentials go in mise.local.toml (gitignored):
#   [env]
#   DIGISAC_URL = "https://your-company.digisac.io/api/v1"
#   DIGISAC_TOKEN = "..."

[tasks.fmt]
description = "Run gofmt"
run = "gofmt -s -w ."

[tasks.test]
description = "Run tests"
run = "go test ./..."

[tasks."test:ci"]
description = "Run tests with race detection"
run = "go test -race ./..."

[tasks.build]
description = "Build the plugin binary"
run = "go build -o bin/mf-digisac ./cmd/mf-digisac"

[tasks.install]
description = "Build and install the plugin into the local mf CLI"
run = "scripts/install-local.sh"

[tasks."release:snapshot"]
description = "Build release archives locally under dist/ without publishing"
run = "goreleaser release --snapshot --clean"

[tasks.build-all]
description = "Cross-build common mf CLI plugin targets"
run = '''
set -e
for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
  GOOS="${target%/*}" GOARCH="${target#*/}" go build ./...
done
'''

[tasks.check]
description = "Run formatting, linting, tests, and builds"
depends = ["lint", "test:ci", "build-all"]
