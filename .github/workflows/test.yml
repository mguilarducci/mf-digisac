# Adapted from entireio/entire-brain (MIT, see NOTICE).
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4
      - run: mise run lint
      # Same config as `mise run lint:go`, but the action annotates issues
      # inline on the PR. The version is read from mise.toml so the two pins
      # can't drift.
      - name: Resolve golangci-lint version
        id: golangci
        run: |
          version=$(sed -n "s/^golangci-lint = '\(.*\)'$/\1/p" mise.toml)
          [ -n "$version" ] || { echo "could not read the golangci-lint version from mise.toml" >&2; exit 1; }
          echo "version=v$version" >> "$GITHUB_OUTPUT"
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ steps.golangci.outputs.version }}

  unit:
    strategy:
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [darwin, linux, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./...

  # Single required status check for branch protection.
  test:
    needs: [lint, unit, build]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: |
          [ "${{ needs.lint.result }}" = "success" ]
          [ "${{ needs.unit.result }}" = "success" ]
          [ "${{ needs.build.result }}" = "success" ]
