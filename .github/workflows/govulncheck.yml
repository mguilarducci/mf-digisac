# Adapted from entireio/cli via mf-cli (MIT, see NOTICE).
name: govulncheck

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 6 * * *'

concurrency:
  group: govulncheck-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4

      - name: Run govulncheck
        run: mise run lint:vuln
